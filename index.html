    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
      :root{
        --ink:#152238;
        --navy:#0d1622;
        --gold:#c9a24d;
        --gold-bright:#e8c983;
        --cream:#FFFFFF;
        --crimson:#8e1f28;
        --line: rgba(201,162,77,0.35);
      }
      *{margin:0;padding:0;box-sizing:border-box;}
      html,body{
        background:var(--ink);
  color:var(--cream);
  font-family:'Tajawal','Cormorant Garamond',serif;
  overflow-x:hidden;
  width:100%;
  min-height:100%;  
      }
      ::selection{background:var(--gold);color:#07080b;}
    
      /* ---------- STAGE ---------- */
      #stage{
        position:fixed;
        inset:0;
        width:100%;
        height:100vh;
        background:var(--ink);
        overflow:hidden;
        z-index:1000;

      }
    
      /* Ken-burns photo layer */
      .photo-wrap{
        position:absolute;
        inset:0;
        overflow:hidden;
      }
      .photo{
        position:absolute;
        inset:0;
        width:100%;
        height:100%;
        background-size:cover;
        background-position:center 30%;
        transform:scale(1.18);
        filter:brightness(0.55) saturate(1.05) contrast(1.05);
        will-change:transform, filter;
      }
      .photo-shade{
        position:absolute;inset:0;
        background:
          radial-gradient(120% 90% at 50% 100%, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.1) 55%, rgba(0,0,0,0) 70%),
          linear-gradient(180deg, rgba(5,6,9,0.55) 0%, rgba(5,6,9,0.05) 30%, rgba(5,6,9,0.05) 60%, rgba(5,6,9,0.65) 100%);
        pointer-events:none;
      }
    
      /* Double-door curtain wipe (the signature reveal) */
      .door{
        position:absolute;
        top:0; bottom:0;
        width:50%;
        background:
          linear-gradient(180deg, #0a0c10 0%, #05060a 100%);
        z-index:20;
        box-shadow: 0 0 60px rgba(0,0,0,0.6);
      }
      .door::after{
        content:"";
        position:absolute;
        top:0; bottom:0;
        width:2px;
        background:linear-gradient(180deg, transparent, var(--gold-bright) 20%, var(--gold-bright) 80%, transparent);
        box-shadow:0 0 18px 2px rgba(232,201,131,0.7);
      }
      .door-l{ left:0; }
      .door-l::after{ right:-1px; }
      .door-r{ right:0; }
      .door-r::after{ left:-1px; }
    
      /* Letterbox cinematic bars */
      .bar{
        position:absolute;
        left:0; right:0;
        height:14vh;
        background:#020203;
        z-index:30;
      }
      .bar-top{ top:0; transform:translateY(0); }
      .bar-bottom{ bottom:0; transform:translateY(0); }
      .bar::before{
        content:"";
        position:absolute;
        left:0; right:0;
        height:1px;
        background:linear-gradient(90deg, transparent, var(--gold) 25%, var(--gold-bright) 50%, var(--gold) 75%, transparent);
        opacity:0.7;
      }
      .bar-top::before{ bottom:0; }
      .bar-bottom::before{ top:0; }
    
      /* Center seam line before doors open */
      .seam{
        position:absolute;
        top:50%; left:50%;
        width:0%;
        height:1px;
        background:linear-gradient(90deg, transparent, var(--gold-bright), transparent);
        transform:translate(-50%,-50%);
        z-index:25;
        box-shadow:0 0 12px 1px rgba(232,201,131,0.8);
      }
    
      /* Gold dust particles */
      #particles{
        position:absolute; inset:0;
        z-index:22;
        pointer-events:none;
      }
      .mote{
        position:absolute;
        width:3px; height:3px;
        border-radius:50%;
        background:var(--gold-bright);
        opacity:0;
        box-shadow:0 0 6px 1px rgba(232,201,131,0.8);
      }
    
      /* Text block */
      .stage-text{
        position:absolute;
        left:50%; bottom:19vh;
        transform:translateX(-50%);
        z-index:40;
        text-align:center;
        width:100%;
        padding:0 24px;
      }
      .eyebrow{
        font-family:'Cormorant Garamond', serif;
        letter-spacing:0.55em;
        font-size:clamp(11px,1.4vw,14px);
        color:var(--gold-bright);
        text-transform:uppercase;
        opacity:0;
        margin-bottom:14px;
      }
      .eyebrow span{ display:inline-block; }
      .rule{
        width:0;
        height:1px;
        background:var(--gold);
        margin:0 auto 22px;
      }
      .headline{
        font-family:'Playfair Display', serif;
        font-weight:900;
        font-style:italic;
        font-size:clamp(30px, 6.2vw, 74px);
        line-height:1.05;
        color:var(--cream);
        opacity:0;
        letter-spacing:0.01em;
        text-shadow:0 6px 40px rgba(0,0,0,0.6);
    }
      .headline b{
        color:var(--gold-bright);
        font-style:italic;
        background:linear-gradient(90deg,#d9b465,#f2ddaa 40%,#c9a24d);
        -webkit-background-clip:text;
        background-clip:text;
        -webkit-text-fill-color:transparent;
      }
    
      /* CTA */
      .enter-wrap{
        margin-top:34px;
        opacity:0;
      }
      .enter-btn{
        position:relative;
        display:inline-flex;
        align-items:center;
        gap:14px;
        padding:16px 46px;
        background:transparent;
        border:1px solid var(--gold);
        color:var(--cream);
        font-family:'Tajawal';
        font-weight:700;
        font-size:15px;
        letter-spacing:0.12em;
        cursor:pointer;
        overflow:hidden;
        transition:color .4s ease, border-color .4s ease;
      }
      .enter-btn::before{
        content:"";
        position:absolute;
        inset:0;
        background:var(--gold);
        transform:scaleX(0);
        transform-origin:right;
        transition:transform .5s cubic-bezier(.65,0,.35,1);
        z-index:-1;
      }
      .enter-btn:hover{ color:#0a0a0a; }
      .enter-btn:hover::before{ transform:scaleX(1); transform-origin:left; }
      .enter-btn .arrow{ transition:transform .4s ease; }
      .enter-btn:hover .arrow{ transform:translateX(-6px); }
    
      .corner-mark{
        position:absolute;
        z-index:35;
        width:34px; height:34px;
        border:1px solid var(--line);
        opacity:0;
      }
      .cm-tl{ top:14vh; left:24px; border-left:none; border-top:none; }
      .cm-tr{ top:14vh; right:24px; border-right:none; border-top:none; }
      .cm-bl{ bottom:14vh; left:24px; border-left:none; border-bottom:none; }
      .cm-br{ bottom:14vh; right:24px; border-right:none; border-bottom:none; }
    
      .rec-label{
        position:absolute;
        top:calc(14vh + 22px);
        left:26px;
        z-index:35;
        display:flex;
        align-items:center;
        gap:8px;
        font-family:'Tajawal';
        font-size:11px;
        letter-spacing:0.2em;
        color:rgba(243,239,228,0.6);
        opacity:0;
      }
      .rec-dot{
        width:6px; height:6px; border-radius:50%;
        background:var(--crimson);
        box-shadow:0 0 8px 2px rgba(142,31,40,0.7);
      }
      .year-label{
        position:absolute;
        top:calc(14vh + 22px);
        right:26px;
        z-index:35;
        font-family:'Cormorant Garamond';
        font-size:13px;
        letter-spacing:0.25em;
        color:rgba(243,239,228,0.6);
        opacity:0;
      }
    
      /* -------- MAIN SITE PLACEHOLDER (what appears after intro) -------- */
      #site{
        position:relative;
        min-height:100vh;
        background:var(--ink);
        display:flex;
        align-items:center;
        justify-content:center;
        text-align:center;
        padding:60px 24px;
      }
      #site h2{
        font-family:'Playfair Display';
        font-style:italic;
        font-weight:800;
        color:var(--gold-bright);
        font-size:clamp(22px,4vw,40px);
        margin-bottom:16px;
      }
      #site p{
        color:rgba(243,239,228,0.65);
        font-size:16px;
        max-width:520px;
        line-height:1.9;
      }
      .skip-btn{
        position:fixed;
        bottom:20px; left:20px;
        z-index:1001;
        background:transparent;
        border:1px solid rgba(243,239,228,0.25);
        color:rgba(243,239,228,0.55);
        font-family:'Tajawal';
        font-size:11px;
        letter-spacing:0.1em;
        padding:8px 16px;
        cursor:pointer;
      }
      .skip-btn:hover{ color:var(--gold-bright); border-color:var(--gold); }
    
      @media (max-width:640px){
        .bar{ height:9vh; }
        .cm-tl,.cm-tr{ top:9vh; }
        .cm-bl,.cm-br{ bottom:9vh; }
        .rec-label,.year-label{ top:calc(9vh + 16px); }
        .stage-text{ bottom:13vh; }
      }
      /* Graduation background layer: a soft, page-wide veil of floating
         emojis. It stays BEHIND the flipbook (true background), covering
         the full page, light and see-through, never blocking clicks. */
      .grad-bg-layer{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
  }
  .grad-bg-layer .piece{
    position:absolute;
    top:-60px;
    font-size:24px;
    opacity:0;
    will-change:transform, opacity;
    animation-name:gradFall;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
    filter:drop-shadow(0 3px 5px rgba(0,0,0,0.12));
  }
  .grad-bg-layer .piece.small{ font-size:14px; filter:blur(0.6px) drop-shadow(0 2px 3px rgba(0,0,0,0.08)); }
  .grad-bg-layer .piece.large{ font-size:34px; filter:drop-shadow(0 4px 6px rgba(0,0,0,0.14)); }
 
  @keyframes gradFall{
    0%{
      transform:translateY(0) translateX(0) rotate(0deg) scale(0.9);
      opacity:0;
    }
    8%{ opacity:0.16; }
    50%{
      transform:translateY(50vh) translateX(var(--drift,20px)) rotate(180deg) scale(1);
      opacity:0.2;
    }
    92%{ opacity:0.15; }
    100%{
      transform:translateY(115vh) translateX(calc(var(--drift,20px) * -1)) rotate(360deg) scale(0.9);
      opacity:0;
    }
  }
 
  /* ورق كونفيتي مستطيل ملون (اختياري بجانب الإيموجي) */
  .grad-bg-layer .confetti{
    position:absolute;
    top:-40px;
    width:10px; height:16px;
    border-radius:2px;
    opacity:0;
    animation-name:gradFall;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
  }

    </style>

    <script>
    (function(){
      // build gold dust particles (fewer on small/mobile screens for smoother performance)
      const field = document.getElementById('particles');
      const N = window.matchMedia('(max-width:640px)').matches ? 12 : 22;
      const motes = [];
      for(let i=0;i<N;i++){
        const m = document.createElement('div');
        m.className = 'mote';
        const x = Math.random()*100;
        const y = 55 + Math.random()*45;
        m.style.left = x+'%';
        m.style.top = y+'%';
        const size = 2 + Math.random()*3;
        m.style.width = size+'px';
        m.style.height = size+'px';
        field.appendChild(m);
        motes.push(m);
      }
    
      function floatMotes(){
        motes.forEach(m=>{
          gsap.to(m,{
            y: -(80+Math.random()*160),
            x: (Math.random()*60-30),
            opacity: 0,
            duration: 4+Math.random()*4,
            delay: Math.random()*3,
            ease:'power1.out',
            onStart:function(){ gsap.set(m,{opacity:0.15+Math.random()*0.6}); },
            onComplete:function(){
              gsap.set(m,{y:0,x:0,top:(55+Math.random()*45)+'%',left:(Math.random()*100)+'%'});
              floatOne(m);
            }
          });
        });
      }
      function floatOne(m){
        gsap.to(m,{
          y: -(80+Math.random()*160),
          x:(Math.random()*60-30),
          opacity:0,
          duration:4+Math.random()*4,
          ease:'power1.out',
          onStart:function(){ gsap.set(m,{opacity:0.15+Math.random()*0.6}); },
          onComplete:function(){
            gsap.set(m,{y:0,x:0,top:(55+Math.random()*45)+'%',left:(Math.random()*100)+'%'});
            floatOne(m);
          }
        });
      }
    
      const tl = gsap.timeline({defaults:{ease:'power3.out'}});
    
      // 1. seam draws
      tl.to('.seam',{width:'70%',duration:0.9,ease:'power2.inOut'})
        .to('.seam',{opacity:0,duration:0.25},'+=0.05')
    
      // 2. letterbox bars slide to frame position
        .fromTo('.bar-top',{yPercent:-100},{yPercent:0,duration:0.7,ease:'power4.out'},'-=0.1')
        .fromTo('.bar-bottom',{yPercent:100},{yPercent:0,duration:0.7,ease:'power4.out'},'<')
    
      // 3. corner marks + labels fade
        .to(['.corner-mark','.rec-label','.year-label'],{opacity:1,duration:0.6,stagger:0.05},'-=0.3')
    
      // 4. doors open (the reveal)
        .to('.door-l',{xPercent:-100,duration:1.4,ease:'power4.inOut'},'+=0.05')
        .to('.door-r',{xPercent:100,duration:1.4,ease:'power4.inOut'},'<')
    
      // 5. photo ken-burns continues, shade breathes in
        .to('.photo',{scale:1.0,duration:3.2,ease:'power2.out'},'<')
    
      // particles start drifting as doors open
        .call(floatMotes,null,'<0.2')
    
      // 6. text reveal
        .to('.eyebrow',{opacity:1,duration:0.7},'-=1.6')
        .to('.rule',{width:'120px',duration:0.7,ease:'power2.out'},'<')
        .fromTo('.headline',{opacity:0,y:26},{opacity:1,y:0,duration:0.9},'-=0.3')
        .to('.enter-wrap',{opacity:1,duration:0.7},'-=0.3');
    
      // Enter site: retract everything, scroll down / fade stage
      function enterSite(){
        const t2 = gsap.timeline();
        t2.to('.stage-text',{opacity:0,y:-16,duration:0.4})
          .to(['.bar-top'],{yPercent:-100,duration:0.7,ease:'power4.inOut'},'<')
          .to(['.bar-bottom'],{yPercent:100,duration:0.7,ease:'power4.inOut'},'<')
          .to('.photo',{scale:1.12,filter:'brightness(0.3)',duration:0.9,ease:'power2.in'},'<')
          .to('#stage',{opacity:0,duration:0.6,ease:'power2.in'},'-=0.3')
          .set('#stage',{display:'none'})
          .call(()=>{ document.getElementById('site').scrollIntoView({behavior:'smooth'}); });
      }
    
      document.getElementById('enterBtn').addEventListener('click', enterSite);
      document.getElementById('skipBtn').addEventListener('click', ()=>{
        tl.progress(1);
        enterSite();
      });
    })();
    </script>

  const tonearm = document.getElementById('tonearm');
  const playIcon = document.getElementById('playIcon');
  const pauseIcon = document.getElementById('pauseIcon');
  const fill = document.getElementById('progressFill');

  btn.addEventListener('click', function(){
    if(audio.paused){
      audio.play().catch(()=>{ /* المتصفح ممكن يمنع التشغيل التلقائي قبل تفاعل المستخدم */ });
      vinyl.classList.add('spinning');
      tonearm.classList.add('playing');
      playIcon.style.display='none';
      pauseIcon.style.display='block';
    } else {
      audio.pause();
      vinyl.classList.remove('spinning');
      tonearm.classList.remove('playing');
      playIcon.style.display='block';
      pauseIcon.style.display='none';
    }
  });

  audio.addEventListener('timeupdate', function(){
    if(audio.duration){
      fill.style.width = (audio.currentTime/audio.duration*100) + '%';
    }
  });

  audio.addEventListener('ended', function(){
    vinyl.classList.remove('spinning');
    tonearm.classList.remove('playing');
    playIcon.style.display='block';
    pauseIcon.style.display='none';
  });

  document.getElementById('closeBtn').addEventListener('click', function(){
    audio.pause();
    vinyl.classList.remove('spinning');
    tonearm.classList.remove('playing');
    playIcon.style.display='block';
    pauseIcon.style.display='none';
  });
})();
</script>

<script>
/* ---------------------------------------------------------------
   Graduation celebration background (light, floating 3D emojis)
   - Drifts across the entire page, very lightly transparent
   - Purely decorative: pointer-events disabled so it never blocks clicks
   --------------------------------------------------------------- */
(function(){
  const layer = document.getElementById('gradBgLayer');
  if(!layer) return;

  const EMOJIS = ['🎓','📜','🎉','✨','🥳','🏆','⭐','🎊'];
  const isSmall = window.matchMedia('(max-width:640px)').matches;
  const COUNT = isSmall ? 12 : 22;

  const frag = document.createDocumentFragment();
  for(let i = 0; i < COUNT; i++){
    const piece = document.createElement('span');
    const roll = Math.random();
    piece.className = 'piece' + (roll < 0.3 ? ' small' : roll > 0.75 ? ' large' : '');
    piece.textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];

    const left = Math.random() * 100;
    const duration = 12 + Math.random() * 9;      // 12s - 21s per loop
    const negativeDelay = Math.random() * duration; // stagger so it looks already in motion on load
    const drift = Math.round(Math.random() * 90 - 45) + 'px';

    piece.style.left = left + '%';
    piece.style.setProperty('--drift', drift);
    piece.style.animationDuration = duration + 's';
    piece.style.animationDelay = '-' + negativeDelay + 's';

    frag.appendChild(piece);
  }
  layer.appendChild(frag);
})();
</script>

<script>

   /******************************
* RESPONSIVE WARNING BEHAVIOR *
******************************/

const responsiveWarning = document.getElementById("responsive-warning");
// Enable/disable responsive warning.
const responsiveDesign = true;
// Mobile width limit.
const threshold = 768;

// Show or hide modal based on screen size.
function checkResponsiveState() {
  if (!responsiveWarning) return;
  const small = window.innerWidth <= threshold;

  if (!responsiveDesign && small) {
    if (!responsiveWarning.open) {
      responsiveWarning.showModal();
      document.body.classList.add("overflow-hidden");
    }
  } else {
    if (responsiveWarning.open) {
      responsiveWarning.close();
      document.body.classList.remove("overflow-hidden");
    }
  }
}

// Initial check.
checkResponsiveState();

// Real-time resize detection (debounced to avoid excessive reflows).
let resizeTimer;
window.addEventListener("resize", function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(checkResponsiveState, 150);
});
   </script>
